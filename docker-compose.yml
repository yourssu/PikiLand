services:
  pikiland-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pikiland-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - PIKILAND_ADMIN_USERS=${PIKILAND_ADMIN_USERS:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_PRIVATE_KEY_PATH=${GITHUB_PRIVATE_KEY_PATH:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - LOG_RECEIVER_TOKEN=${LOG_RECEIVER_TOKEN:-}
      - PIKILAND_SERVER_URL=${PIKILAND_SERVER_URL:-}
      - DATABASE_PATH=/app/data/pikiland.sqlite
      - DEBUG=${DEBUG:-false}
    volumes:
      - pikiland_data:/app/data

volumes:
  pikiland_data:
