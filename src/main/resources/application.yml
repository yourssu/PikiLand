spring:
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-client-secret}
            scope:
              - read:user
              - repo

server:
  port: 8080
  forward-headers-strategy: framework

app:
  server-url: ${PIKILAND_SERVER_URL:}
  debug: ${PIKILAND_DEBUG:${DEBUG:false}}
  admin:
    users: ${PIKILAND_ADMIN_USERS:}
  github:
    app-id: ${GITHUB_APP_ID:}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:github-app-private-key.pem}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  log-receiver:
    token: ${LOG_RECEIVER_TOKEN:your_secure_agent_token_here}
  ai:
    openai-api-key: ${OPENAI_API_KEY:${PIKILAND_AI_API_KEY:}}
    openai-base-url: ${OPENAI_BASE_URL:${PIKILAND_AI_BASE_URL:https://api.openai.com/v1}}
    model: ${AI_MODEL:gpt-4o}


