spring:
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-client-secret}
            scope:
              - read:user
              - repo

server:
  port: 8080
  forward-headers-strategy: framework

app:
  debug: ${PIKILAND_DEBUG:${DEBUG:false}}
  ai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_MODEL:gpt-4o}
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20240620}
  admin:
    users: ${PIKILAND_ADMIN_USERS:}
  github:
    app-id: ${GITHUB_APP_ID:}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:github-app-private-key.pem}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
