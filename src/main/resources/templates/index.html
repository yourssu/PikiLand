<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PikiLand 🏰 AI Error Monitor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="landing-body">
    <div class="glow-bg"></div>
    <div class="glass-card landing-card">
        <div class="castle-icon">🏰</div>
        <h1 class="main-title">PikiLand</h1>
        <p class="tagline">AI-Powered Self-Healing Autopilot for your GitHub Workflows & Issues.</p>
        
        <div class="features-list">
            <div class="feature-item">
                <span class="feature-bullet">⚡</span>
                <span class="feature-text">Real-time error analysis on Virtual Threads</span>
            </div>
            <div class="feature-item">
                <span class="feature-bullet">🤖</span>
                <span class="feature-text">Autonomous AI code search & patching</span>
            </div>
            <div class="feature-item">
                <span class="feature-bullet">💬</span>
                <span class="feature-text">Instant Slack notifications for stakeholders</span>
            </div>
        </div>

        <a href="/oauth2/authorization/github" class="btn btn-primary btn-login">
            <svg class="github-icon" viewBox="0 0 16 16" version="1.1" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
            Connect with GitHub
        </a>
    </div>
    <script>
        const savedTheme = localStorage.getItem('pikiland-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
