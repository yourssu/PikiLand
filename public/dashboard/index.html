<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard</title>
    </head>
    <body>
        <main>
            <header>
                <h1>
                    안녕하세요, <span id="githubLogin">불러오는 중…</span>님!
                </h1>
                <nav aria-label="주요 링크">
                    <a href="/docs">문서 보기</a>
                </nav>
            </header>

            <section aria-labelledby="repositoriesHeading">
                <h2 id="repositoriesHeading">저장소</h2>
                <p id="repositoryMessage" role="status" aria-live="polite">
                    저장소를 불러오는 중…
                </p>
                <ul id="repositories" aria-label="저장소 목록" hidden></ul>
            </section>
        </main>

        <script type="module">
            const loginElement = document.querySelector("#githubLogin");
            const listElement = document.querySelector("#repositories");
            const messageElement = document.querySelector("#repositoryMessage");

            async function fetchJson(url) {
                const response = await fetch(url, {
                    headers: { Accept: "application/json" },
                });

                if (response.status === 401) {
                    window.location.assign("/auth/github");
                    throw new Error("AUTH_REDIRECT");
                }

                if (!response.ok) {
                    throw new Error(`요청 실패: ${response.status}`);
                }

                return response.json();
            }

            async function loadDashboard() {
                try {
                    const [user, repositoryData] = await Promise.all([
                        fetchJson("/api/users/me"),
                        fetchJson("/api/repositories"),
                    ]);

                    loginElement.textContent = user.login || "User";

                    const repositories = Array.isArray(
                        repositoryData.repositories,
                    )
                        ? repositoryData.repositories
                        : [];

                    if (repositories.length === 0) {
                        messageElement.textContent =
                            "표시할 저장소가 없습니다.";
                        return;
                    }

                    const fragment = document.createDocumentFragment();

                    for (const repo of repositories) {
                        const item = document.createElement("li");
                        item.textContent = repo.full_name ?? "이름 없는 저장소";
                        fragment.appendChild(item);
                    }

                    listElement.replaceChildren(fragment);
                    listElement.hidden = false;
                    messageElement.hidden = true;
                } catch (error) {
                    if (error.message === "AUTH_REDIRECT") return;

                    loginElement.textContent = "User";
                    messageElement.textContent =
                        "데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
                }
            }

            loadDashboard();
        </script>
    </body>
</html>
